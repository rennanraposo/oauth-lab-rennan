name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala o Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE_REF"...HEAD > diff.txt
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            head -c 20000 diff.txt
            echo
            echo '```'
          } > prompt.txt

      - name: Revisa com IA
        id: ia
        uses: actions/ai-inference@41caef41a74eb26f6d0c6b1e9941d691588e0b2b
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.ia.outputs.response-file }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RESPONSE_FILE"